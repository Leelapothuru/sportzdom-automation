[pytest]
testpaths = tests
addopts = -ra --junitxml=reports/automation/latest_junit.xml
markers =
    tournament: Single Tournament creation wizard
    smoke: Knockout creation flow (one tournament)
    league: League creation flow (one tournament)
    badminton: Badminton Singles Knockout creation flow
    publish: publishes the created tournaments (test environment only)
    validation: negative and boundary checks
    creation: saves a tournament on the account (one Knockout and one League per run)
    incremental: ordered steps of one flow; later steps skip after a failure
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(name)s: %(message)s
junit_family = xunit2
